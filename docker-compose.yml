services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kosmobereg-db
    environment:
      POSTGRES_USER: kosmobereg
      POSTGRES_PASSWORD: kosmobereg
      POSTGRES_DB: kosmobereg
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmobereg"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: kosmobereg-api
    environment:
      ENV: local
      DATABASE_URL: postgresql+asyncpg://kosmobereg:kosmobereg@db:5432/kosmobereg
      SECRET_KEY: local-dev-secret-change-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Миграции применяются при старте: контейнер должен подниматься на
    # чистой базе одной командой, без ручных шагов.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  prototype:
    build: ./prototype
    container_name: kosmobereg-prototype
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
